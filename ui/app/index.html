<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oficina IASIMA</title>
<link rel="icon" href="data:,">
<style>
:root{
  --fondo:#F4F7F5; --panel:#FFFFFF; --borde:#D6E0DC; --borde2:#C4D0CC;
  --tinta:#0E1614; --tinta2:#3C4B47; --tinta3:#6B7C77;
  --sello:#0B4A3F; --sello2:#083A31;
  --ok:#1B7F5E; --alto:#8A6410; --critico:#B3402E; --neutro:#566B77;
  --m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --fondo:#141816; --panel:#1C2220; --borde:#2C3531; --borde2:#3A4540;
  --tinta:#EDE7D8; --tinta2:#BDB6A4; --tinta3:#8B9590;
  --sello:#6FD3AE; --sello2:#4FB892;
  --ok:#3FA87E; --alto:#D0A03A; --critico:#E07A62; --neutro:#8CA1AC;}}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:14px/1.5 Helvetica,Arial,sans-serif}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:2px solid var(--sello);background:var(--panel);flex-wrap:wrap}
header h1{margin:0;font:700 15px var(--m);letter-spacing:.04em;color:var(--sello)}
header nav{display:flex;gap:4px;flex-wrap:wrap}
header nav button{font:12px var(--m);padding:6px 12px;border:1px solid var(--borde2);background:transparent;color:var(--tinta2);border-radius:4px;cursor:pointer}
header nav button[aria-selected="true"]{background:var(--sello);color:#fff;border-color:var(--sello)}
header .yo{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--tinta3)}
header .yo input{font:12px var(--m);padding:5px 8px;border:1px solid var(--borde2);border-radius:4px;background:var(--fondo);color:var(--tinta);width:170px}
main{max-width:1180px;margin:0 auto;padding:20px 16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{font:11px var(--m);padding:4px 10px;border:1px solid var(--borde2);border-radius:999px;color:var(--tinta2);background:var(--panel)}
.chip b{color:var(--tinta)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px}
.tile{background:var(--panel);border:1px solid var(--borde);border-radius:6px;padding:12px 14px}
.tile .k{font:700 10.5px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--tinta3)}
.tile .v{font:700 26px/1.1 var(--m);margin-top:6px;color:var(--tinta)}
.tile .s{font-size:11.5px;color:var(--tinta3);margin-top:4px}
section{background:var(--panel);border:1px solid var(--borde);border-radius:6px;padding:14px 16px;margin-bottom:16px}
section h2{margin:0 0 10px;font:700 11px var(--m);letter-spacing:.12em;text-transform:uppercase;color:var(--tinta3)}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
button.b{font:12px var(--m);padding:6px 12px;border:1px solid var(--sello);background:var(--sello);color:#fff;border-radius:4px;cursor:pointer}
button.b.gh{background:transparent;color:var(--sello)}
button.b.rj{background:transparent;color:var(--critico);border-color:var(--critico)}
button.b:disabled{opacity:.5;cursor:default}
select,input.f{font:12px var(--m);padding:6px 8px;border:1px solid var(--borde2);border-radius:4px;background:var(--fondo);color:var(--tinta)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:7px 8px;font:700 10.5px var(--m);letter-spacing:.06em;text-transform:uppercase;color:var(--tinta3);border-bottom:2px solid var(--borde2)}
td{padding:7px 8px;border-bottom:1px solid var(--borde);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--m)}
.mono{font-family:var(--m);font-size:11.5px}
.sub{font-size:11.5px;color:var(--tinta3)}
.est{display:inline-block;font:700 10.5px var(--m);padding:2px 7px;border-radius:3px;border:1px solid}
.est.ok{color:var(--ok);border-color:var(--ok)} .est.alto{color:var(--alto);border-color:var(--alto)}
.est.critico{color:var(--critico);border-color:var(--critico)} .est.neutro{color:var(--neutro);border-color:var(--neutro)}
.al{border-left:4px solid var(--neutro);padding:8px 12px;margin-bottom:8px;background:var(--fondo)}
.al.alto{border-color:var(--alto)} .al.critico{border-color:var(--critico)} .al.ok{border-color:var(--ok)}
.al .t{font-weight:700;font-size:13px} .al .d{font-size:12px;color:var(--tinta2);margin-top:3px;line-height:1.5}
.aviso{font-size:12.5px;color:var(--tinta2);background:var(--fondo);padding:10px 12px;border-radius:4px;margin-bottom:10px}
#msg{position:fixed;bottom:16px;right:16px;max-width:420px;background:var(--sello2);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;display:none;z-index:9}
#msg.err{background:var(--critico)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow:auto;padding:4px 2px 10px}
.msg{max-width:88%;padding:9px 12px;border-radius:8px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--sello);color:#fff}
.msg.dir{align-self:flex-start;background:var(--fondo);border:1px solid var(--borde)}
.msg .w{display:block;font:700 10px var(--m);letter-spacing:.1em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.pasos{font:11px var(--m);color:var(--tinta3);margin-top:6px;border-top:1px dashed var(--borde2);padding-top:5px}
.pasos div{margin-top:2px}
form.row{display:flex;gap:8px;margin-top:10px}
form.row input{flex:1;font:14px Helvetica,Arial,sans-serif;padding:9px 12px;border:1px solid var(--borde2);border-radius:6px;background:var(--fondo);color:var(--tinta)}
iframe.prev{width:100%;height:520px;border:1px solid var(--borde);border-radius:4px;background:#fff}
a{color:var(--sello)}
@media (max-width:640px){header{padding:10px 12px}main{padding:12px 10px}td,th{padding:6px 5px}}
</style>
</head>
<body>
<header>
  <h1 id="marca">OFICINA</h1>
  <nav id="nav">
    <button data-v="tablero" aria-selected="true">Tablero</button>
    <button data-v="director">Director</button>
    <button data-v="casos">Casos</button>
    <button data-v="aprobaciones">Aprobaciones</button>
    <button data-v="correos">Correos</button>
    <button data-v="corridas">Corridas</button>
    <button data-v="auditoria">Auditoría</button>
    <button data-v="usuarios">Usuarios</button>
  </nav>
  <div class="yo">
    <label for="quien">Soy</label><input id="quien" placeholder="nombre o correo">
    <input id="token" placeholder="token (opcional, si no entró)" type="password" title="Solo hace falta si no usó la pantalla de entrada">
    <button class="b gh" id="salir" style="display:none" title="Cerrar sesión">Salir</button>
  </div>
</header>
<main id="main"></main>
<div id="msg"></div>
<script>
(function(){
"use strict";
var S = { vista:"tablero", estado:null, companias:[], filtros:{ receptor:"", compania:"", frente:"", seguimiento:"abierto" }, correoAbierto:null, chat:[], conversacion:null, conversaciones:[], directorCargado:false, retencionDias:30 };
// Con varios inquilinos la app vive en /t/<id>/; todas las llamadas llevan ese prefijo.
var PREFIJO = (location.pathname.match(/^\/t\/[a-z0-9_-]+/i)||[""])[0];
var $ = function(s){ return document.querySelector(s); };
var esc = function(s){ return String(s==null?"":s).replace(/[<>&"]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c];}); };
var n = function(x){ return typeof x==="number" ? x.toLocaleString("es-CR") : (x==null?"—":String(x)); };
// Markdown mínimo del Director (negrita, código, viñetas, títulos), siempre sobre texto ya escapado.
var md = function(t){ return esc(t).replace(/^#{1,4} +(.+)$/gm,"<b>$1</b>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/^[-*] +/gm,"• ").replace(/\*\*/g,""); };
var fecha = function(s){ return s ? new Date(s).toLocaleString("es-CR",{dateStyle:"medium",timeStyle:"short"}) : "—"; };

try { $("#quien").value = localStorage.getItem("iasima_quien")||""; $("#token").value = localStorage.getItem("iasima_token")||""; } catch(e){}
$("#quien").addEventListener("change", function(){ try{ localStorage.setItem("iasima_quien", this.value); }catch(e){}
  // la memoria del Director es por persona: al cambiar el nombre se carga SU conversación, sin recargar
  S.chat=[]; S.conversacion=null; S.nueva=false; S.directorCargado=false; if (S.vista==="director") pintar(); });
$("#token").addEventListener("change", function(){ try{ localStorage.setItem("iasima_token", this.value); }catch(e){} });

function msg(t, err){ var m=$("#msg"); m.textContent=t; m.className=err?"err":""; m.style.display="block"; clearTimeout(msg.t); msg.t=setTimeout(function(){ m.style.display="none"; }, err?6000:3500); }
function api(ruta, cuerpo){
  var op = { headers: { "X-Quien": $("#quien").value || "anónimo" }, credentials: "same-origin" };
  if ($("#token").value) op.headers["Authorization"]="Bearer "+$("#token").value;
  if (cuerpo !== undefined){ op.method="POST"; op.headers["Content-Type"]="application/json"; op.body=JSON.stringify(cuerpo||{}); }
  return fetch(PREFIJO+ruta, op).then(function(r){ return r.json().then(function(j){
    if(r.status===401 && j.entrar){ var e=new Error(j.error||"Hace falta entrar."); e.entrar=true; e.inquilino=j.inquilino; e.smtp=j.smtp; throw e; }
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }); });
}
// Pantalla de entrada: el token se valida una vez y queda en una cookie del navegador.
function pedirEntrada(m, smtp){
  marcar(m);
  $("#main").innerHTML='<section style="max-width:420px;margin:40px auto"><h2>Entrar</h2>'+
    '<div class="sub" style="margin-bottom:10px">Si le mandaron un <b>enlace de acceso</b>, ábralo y entra directo. '+(smtp?'Si ya está registrado, pida uno nuevo con su correo.':'Si no lo tiene, pídaselo a su contador.')+'</div>'+
    (smtp?'<form id="pedir"><div class="fila"><input class="f" id="pCorreo" type="email" placeholder="su correo" style="flex:1" autofocus><button class="b" type="submit">Enviarme el enlace</button></div><div class="sub" id="pMsg"></div></form>':"")+
    '<details style="margin-top:14px"><summary class="sub" style="cursor:pointer">Soy del equipo contable: entrar con token</summary>'+
    '<form id="entrar" style="margin-top:8px"><div class="fila"><input class="f" id="eQuien" placeholder="su nombre o correo" style="flex:1" value="'+esc($("#quien").value)+'"></div>'+
    '<div class="fila"><input class="f" id="eToken" type="password" placeholder="token de acceso" style="flex:1"></div>'+
    '<div class="fila"><button class="b" type="submit">Entrar</button></div><div class="sub" id="eMsg"></div></form></details></section>';
  var pf=$("#pedir"); if(pf) pf.addEventListener("submit", function(ev){ ev.preventDefault();
    fetch(PREFIJO+"/api/acceso/pedir",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({correo:$("#pCorreo").value.trim(), base:location.origin}),credentials:"same-origin"})
      .then(function(r){ return r.json(); }).then(function(j){ $("#pMsg").textContent=j.mensaje||j.error||"Listo."; }); });
  $("#entrar").addEventListener("submit", function(ev){ ev.preventDefault();
    var t=$("#eToken").value.trim(), q=$("#eQuien").value.trim();
    if(q){ $("#quien").value=q; try{ localStorage.setItem("iasima_quien", q); }catch(e){} }
    fetch(PREFIJO+"/api/entrar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t}),credentials:"same-origin"})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"No se pudo entrar."); return j; }); })
      .then(function(){ $("#token").value=""; try{ localStorage.removeItem("iasima_token"); }catch(e){} cargar(); })
      .catch(function(e){ $("#eMsg").textContent=e.message; $("#eMsg").style.color="var(--critico)"; });
  });
}
function accion(ruta, cuerpo, ok){
  return api(ruta, cuerpo||{}).then(function(j){ msg(ok || "Listo."); return j; }).catch(function(e){ msg(e.message, true); throw e; }).finally(cargar);
}

/* ---------- vistas ---------- */
var V = {};
V.tablero = function(){
  var e = S.estado, u = e.ultimas, rec = u.recepcion;
  var h = '<div class="chips">'+
    '<span class="chip">Odoo: <b>'+esc(e.odoo.simulado ? "SIMULADO "+e.odoo.simulado : e.odoo.url+" · "+e.odoo.db)+'</b></span>'+
    '<span class="chip">Escritura: <b>'+(e.escrituraPermitida?"permitida":"bloqueada")+'</b></span>'+
    '<span class="chip">Correo: <b>'+(e.smtp?"configurado":"sin SMTP")+'</b></span>'+
    '<span class="chip">Calendario: <b>'+esc(e.programador?e.programador.plan:"—")+'</b></span>'+
    (e.enCurso?'<span class="chip">Corriendo: <b>'+esc(e.enCurso.agente)+'</b></span>':"")+'</div>';
  var t = rec && rec.totales || {};
  var ab = {}; (e.casos.porFrente||[]).forEach(function(x){ ab[x.frente+"|"+x.seguimiento]=x.n; });
  h += '<div class="tiles">'+
    tile("Correos en el buzón", t.total, rec?("última corrida "+fecha(rec.fin)):"sin corrida")+
    tile("Tasa de registro", t.pctOk!=null?t.pctOk+" %":null, "registrados como factura")+
    tile("Compañías", t.companias, "con correos en el buzón")+
    tile("Por reclamar afuera", ab["afuera|abierto"]||0, "documentos abiertos")+
    tile("Por revisar adentro", ab["adentro|abierto"]||0, "documentos abiertos")+
    tile("Propuestas por decidir", e.pendientes.propuestas, e.pendientes.aprobadas+" aprobadas sin aplicar"+(e.pendientes.reglas?" · "+e.pendientes.reglas+" reglas del chat":""))+
    tile("Correos por aprobar", e.pendientes.correos, e.pendientes.correosAprobados+" aprobados sin enviar")+
    '</div>';
  h += '<section><h2>Correr ahora</h2><div class="fila">'+
    '<button class="b" data-correr="recepcion">Recepción (Marta)</button>'+
    '<button class="b gh" data-correr="comunicacion">Comunicación (Victor) → borradores</button>'+
    '<button class="b gh" data-correr="conciliacion">Conciliación</button>'+
    '<select id="ciaCuentas"><option value="">Cuentas de…</option>'+S.companias.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join("")+'</select>'+
    '<button class="b gh" id="correrCuentas">Revisar cuentas → propuestas</button>'+
    '<a href="'+PREFIJO+'/oficina" target="_blank" style="margin-left:auto;font-size:12px">Abrir la oficina 2D</a></div>'+
    '<div class="sub">Nada de esto escribe en Odoo ni manda correos: solo lee y propone. Lo que escribe pasa por Aprobaciones.</div></section>';
  if (rec && rec.alertas && rec.alertas.length){
    h += '<section><h2>Alertas de la última corrida de Recepción</h2>'+rec.alertas.map(alerta).join("")+'</section>';
  }
  var pc = e.casos.porCompania||[], pr = e.casos.porReceptor||[];
  h += '<section><h2>Compañías con casos abiertos</h2>'+(pc.length?tabla(["Compañía",{t:"Afuera",n:1},{t:"Adentro",n:1},{t:"Total",n:1},""],
      pc.slice(0,30).map(function(c){ return [esc(c.compania||"(sin compañía)"), n(c.afuera), n(c.adentro), "<b>"+n(c.total)+"</b>",
        '<a href="#" data-ver-cia="'+c.compania_id+'">ver casos</a>']; })):'<div class="sub">Sin casos abiertos. Corra Recepción.</div>')+'</section>';
  h += '<section><h2>Receptores con casos abiertos</h2>'+(pr.length?tabla(["Receptor",{t:"Afuera",n:1},{t:"Adentro",n:1},{t:"Total",n:1},""],
      pr.slice(0,30).map(function(r){ return ['<span class="mono">'+esc(r.receptor)+'</span>', n(r.afuera), n(r.adentro), "<b>"+n(r.total)+"</b>",
        '<a href="#" data-ver-rec="'+esc(r.receptor)+'">ver casos</a>']; })):'<div class="sub">—</div>')+'</section>';
  return h;
};
V.director = function(){
  var d = S.estado.director || {};
  return '<section><h2>El Director</h2>'+
    '<div class="aviso">'+(d.modo==="llm"
      ? 'Modelo de lenguaje <b>'+esc(d.modelo)+'</b> con los agentes como herramientas. Solo lee y propone: no existe herramienta que escriba en Odoo ni que envíe correos. Pregunte como le preguntaría a una persona: «¿cómo está el buzón?», «¿qué le reclamo a los proveedores de IAR?», «revisá las cuentas de Puuk».'
      : 'Director de <b>palabras clave</b>: dice a qué agente va cada instrucción. Para que además ejecute y responda con cifras, configure <code>CLAUDE_API_KEY</code> en el .env y reinicie el servicio.')+'</div>'+
    (!$("#quien").value || $("#quien").value==="anónimo" ? '<div class="aviso" style="border-color:var(--critico)">Escriba su nombre en <b>Soy</b> (arriba a la derecha) y pulse Enter: la memoria del Director es por persona, y sin nombre todos comparten la conversación «anónimo».</div>' : '')+
    (S.directorCargado?'':'<div class="sub">Cargando la conversación…</div>')+
    '<div class="chat" id="chat">'+(S.chat.length?S.chat.map(function(m){
      return '<div class="msg '+(m.w==="me"?"me":"dir")+'"><span class="w">'+(m.w==="me"?"Usted":"Director")+(m.cuando?' <span style="font-weight:400;opacity:.6">· '+esc(fecha(m.cuando))+'</span>':"")+'</span>'+(m.w==="me"?esc(m.t):md(m.t))+
        (m.pasos&&m.pasos.length?'<div class="pasos">'+m.pasos.map(function(p){return '<div>→ '+esc(p.herramienta)+'('+esc(JSON.stringify(p.args||{}))+') · '+p.ms+' ms</div>';}).join("")+'</div>':"")+'</div>';
    }).join(""):'<div class="sub">Sin conversación todavía. El Director recuerda lo que hablen: al volver, la conversación sigue donde quedó.</div>')+'</div>'+
    '<form class="row" id="cf"><input id="ci" placeholder="Escriba la instrucción…" autocomplete="off"><button class="b" type="submit" id="cEnviar">Enviar</button>'+
    (S.chat.length?'<button class="b gh" type="button" id="cNueva">Nueva conversación</button>':"")+'</form></section>'+
    '<section><h2>Conversaciones anteriores <span class="sub" style="font-weight:400">(se guardan '+S.retencionDias+' días; la oficina 2D usa la misma)</span></h2>'+
    (S.conversaciones.length?tabla(["Cuándo","Tema",{t:"Turnos",n:1},""], S.conversaciones.map(function(c){
      var actual = c.id===S.conversacion;
      return [fecha(c.ultimo), esc(c.titulo||"(sin título)"), n(c.turnos), actual?'<span class="est ok">abierta</span>':'<button class="b gh" data-conv="'+c.id+'">Retomar</button>'];
    })):'<div class="sub">Todavía no hay conversaciones guardadas.</div>')+'</section>';
};
function chatDe(resumen){
  var out=[]; (resumen||[]).forEach(function(t){ out.push({w:"me", t:t.pregunta, cuando:t.cuando}); out.push({w:"dir", t:t.respuesta, pasos:t.pasos}); }); return out;
}
// La conversación abierta de esta persona y la lista de anteriores. Con retomar=false solo refresca la lista.
function cargarDirector(retomar){
  return api("/api/director").then(function(j){
    S.retencionDias=j.retencionDias||30; S.conversaciones=j.conversaciones||[];
    if (retomar){ S.conversacion=j.actual?j.actual.id:null; S.chat=chatDe(j.actual?j.actual.resumen:[]); }
    S.directorCargado=true; if (S.vista==="director") { pintar(); var c=$("#chat"); if(c) c.scrollTop=c.scrollHeight; }
  }).catch(function(e){ S.directorCargado=true; msg(e.message,true); });
}
V.tableroReceptor = function(){
  var e=S.estado, c=e.casos;
  return '<div class="tiles">'+tile("Por reclamar al establecimiento", c.afuera, "tiquetes y rechazados: pida la factura real")+tile("Por revisar adentro", c.adentro, "duplicados, errores, cédulas")+
    tile("Resueltos", c.resueltos, "marcados por usted")+tile("Avisos recibidos", e.correos, "correos de la oficina para usted")+'</div>'+
    '<section><h2>Hola, '+esc(e.usuario.nombre||e.usuario.correo)+'</h2><div class="sub">Última lectura del buzón: '+fecha(e.ultimaRecepcion)+'. Lo que ve aquí es solo lo que llega a <b>'+esc(e.usuario.correo)+'</b>. Cuando resuelva algo (pidió la factura, el proveedor reemitió, era un reenvío), márquelo como resuelto en Casos.</div></section>'+
    '<section><h2>Sus compañías</h2>'+(c.porCompania.length?tabla(["Compañía",{t:"Afuera",n:1},{t:"Adentro",n:1},""],c.porCompania.map(function(x){ return [esc(x.compania||"—"), n(x.afuera), n(x.adentro), '<a href="#" data-ver-cia="'+x.compania_id+'">ver casos</a>']; })):'<div class="sub">Nada abierto. 🙂</div>')+'</section>';
};
V.usuarios = function(){
  return '<section><h2>Usuarios</h2><div class="aviso">Los <b>receptores</b> entran con un enlace y ven solo los casos de su propio correo (el que recibe las facturas en el buzón). Los <b>contables</b> ven todo. '+
    (S.estado.smtp?'El enlace se envía por correo y también queda aquí para copiarlo.':'Sin SMTP configurado, el enlace no se envía: cópielo y mándelo usted (WhatsApp, Teams). Vale 3 días y una sola vez.')+'</div>'+

function cargar(){
  return Promise.all([api("/api/estado"), api("/api/companias")]).then(function(r){
    S.estado=r[0]; S.companias=r[1];
    marcar(S.estado.inquilino);
    pintar();
  }).catch(function(e){
    if (e.entrar) return pedirEntrada(e.inquilino, e.smtp);

    fetch("/api/inquilinos").then(function(x){ return x.json(); }).then(function(lista){
      if (Array.isArray(lista) && lista.length>1 && !PREFIJO){
        $("#main").innerHTML='<section><h2>¿Qué oficina?</h2>'+lista.map(function(i){
          return '<p><a href="'+esc(i.prefijo)+'/" style="font:700 16px var(--m)">'+esc(i.nombre)+'</a> <span class="sub">'+esc(i.prefijo)+'/</span></p>';}).join("")+'</section>';
      } else {
        $("#main").innerHTML='<section><h2>Sin servicio</h2><div class="sub">'+esc(e.message)+'. ¿Está corriendo <code>npm run servicio</code>?</div></section>';
      }
    }).catch(function(){ $("#main").innerHTML='<section><h2>Sin servicio</h2><div class="sub">'+esc(e.message)+'. ¿Está corriendo <code>npm run servicio</code>?</div></section>'; });

function marcar(m){
  if(!m) return;
  document.title="Oficina "+m.nombre;
  var h=$("#marca"); h.innerHTML=(m.logo?'<img src="'+esc(m.logo)+'" alt="" style="height:20px;vertical-align:middle;margin-right:8px">':"")+"OFICINA "+esc(m.nombre).toUpperCase();
  if(m.color){ document.documentElement.style.setProperty("--sello", m.color); document.documentElement.style.setProperty("--sello2", m.color); }
}
var VISTAS_RECEPTOR = ["tablero","casos","correos"];
function pintar(){
  var receptor = S.estado && S.estado.usuario && S.estado.usuario.rol==="receptor";
  document.querySelectorAll("#nav button").forEach(function(b){ b.style.display = (!receptor || VISTAS_RECEPTOR.indexOf(b.dataset.v)>=0) ? "" : "none"; b.setAttribute("aria-selected", b.dataset.v===S.vista?"true":"false"); });
  if (receptor && VISTAS_RECEPTOR.indexOf(S.vista)<0) S.vista="tablero";
  $("#salir").style.display = (S.estado && S.estado.usuario && !S.estado.usuario.porToken) ? "" : "none";
  $("#token").style.display = receptor ? "none" : "";
  if (receptor) $("#quien").readOnly = true;
  $("#main").innerHTML = receptor && S.vista==="tablero" ? V.tableroReceptor() : V[S.vista]();
  // el chat abre siempre en el último mensaje (al volver a la pestaña, al recargar, al responder)
  if (S.vista==="director"){ var ch=$("#chat"); if(ch){ ch.scrollTop=ch.scrollHeight; requestAnimationFrame(function(){ ch.scrollTop=ch.scrollHeight; }); } }
  if (S.vista==="director" && !S.directorCargado) cargarDirector(true);
  if (S.vista==="casos") cargarCasos();
  if (S.vista==="aprobaciones"){ cargarPropuestas(); api("/api/reglas").then(pintarReglas).catch(function(){}); }
  if (S.vista==="correos") cargarCorreos();
  if (S.vista==="corridas") api("/api/corridas").then(pintarCorridas);
  if (S.vista==="auditoria") api("/api/auditoria").then(pintarAuditoria);
  if (S.vista==="usuarios") api("/api/usuarios").then(pintarUsuarios);
}
function cargarCasos(){
  var f=S.filtros, q=[]; if(f.receptor) q.push("receptor="+encodeURIComponent(f.receptor)); if(f.compania) q.push("compania="+f.compania); if(f.frente) q.push("frente="+f.frente); q.push("seguimiento="+f.seguimiento);
  api("/api/casos?"+q.join("&")).then(pintarCasos);
}

  else if (t.id==="pIr"){ cargarPropuestas(); }

  else if (d.rechazar){ var m=prompt("Motivo del rechazo (opcional)"); if(m===null) return; api("/api/propuestas/"+d.rechazar+"/rechazar",{motivo:m}).then(function(){ msg("Rechazada."); cargarPropuestas(); }).catch(function(e){ msg(e.message,true); }); }
  else if (t.id==="pAplicar"){ var ca=$("#pAplicarCia").value; if(!ca) return msg("Elija la compañía.", true);
    if(!confirm("Esto ESCRIBE en Odoo las propuestas aprobadas de esa compañía. ¿Continuar?")) return;
    msg("Aplicando…"); api("/api/propuestas/aplicar",{compania:Number(ca)}).then(function(j){ msg((j.aplicadas||0)+" facturas corregidas"+(j.fallos&&j.fallos.length?", "+j.fallos.length+" con fallo":"")+"."); cargarPropuestas(); }).catch(function(e){ msg(e.message,true); }); }
  else if (d.aprobarRegla){ if(!confirm("La regla se guarda y Cuentas revisa de nuevo esa compañía (puede tardar hasta un minuto). No escribe en Odoo. ¿Continuar?")) return;
    t.disabled=true; msg("Guardando la regla y corriendo Cuentas…");
    api("/api/reglas/"+d.aprobarRegla+"/aprobar",{}).then(function(j){ msg(j.mensaje||"Regla aprobada."); api("/api/reglas").then(pintarReglas); cargarPropuestas(); }).catch(function(e){ t.disabled=false; msg(e.message,true); }); }
  else if (d.rechazarRegla){ api("/api/reglas/"+d.rechazarRegla+"/rechazar",{}).then(function(){ msg("Regla rechazada."); api("/api/reglas").then(pintarReglas); }).catch(function(e){ msg(e.message,true); }); }
  else if (t.id==="cIr"){ cargarCorreos(); }
  else if (t.id==="cNueva"){ var cid=S.conversacion; S.chat=[]; S.conversacion=null; S.nueva=true; pintar();
    if (cid) api("/api/director/"+cid+"/cerrar",{}).then(function(){ cargarDirector(false); }).catch(function(e){ msg(e.message,true); }); }
  else if (d.conv){ api("/api/director/"+d.conv+"/reabrir",{}).then(function(c){ S.conversacion=c.id; S.nueva=false; S.chat=chatDe(c.resumen); cargarDirector(false); pintar(); var ch=$("#chat"); if(ch) ch.scrollTop=ch.scrollHeight; }).catch(function(e){ msg(e.message,true); }); }
  else if (d.invitar){ invitar(d.invitar); }
  else if (d.desactivar){ if(!confirm("¿Desactivar este usuario? Sus sesiones se cierran.")) return; api("/api/usuarios/"+d.desactivar+"/desactivar",{}).then(function(){ msg("Desactivado."); api("/api/usuarios").then(pintarUsuarios); }).catch(function(e){ msg(e.message,true); }); }
  else if (d.verCorreo){ ev.preventDefault(); api("/api/correos/"+d.verCorreo).then(function(c){ var f=document.createElement("iframe"); f.className="prev"; f.setAttribute("sandbox",""); f.srcdoc=c.html; var p=$("#corrPrev"); p.innerHTML='<h2 style="margin-top:14px">Vista previa — '+esc(c.para)+'</h2>'; p.appendChild(f); f.scrollIntoView({behavior:"smooth"}); }); }
  else if (d.aprobarCorreo){ api("/api/correos/"+d.aprobarCorreo+"/aprobar",{}).then(function(){ msg("Aprobado."); cargarCorreos(); }).catch(function(e){ msg(e.message,true); }); }
  else if (d.rechazarCorreo){ api("/api/correos/"+d.rechazarCorreo+"/rechazar",{}).then(function(){ msg("Rechazado."); cargarCorreos(); }).catch(function(e){ msg(e.message,true); }); }
  else if (t.id==="cPrueba"){ msg("Enviando a su correo…"); api("/api/correos/enviar",{real:false}).then(function(j){ msg(j.enviados.length+" enviados en modo prueba"+(j.fallos.length?", "+j.fallos.length+" fallos":"")+"."); cargarCorreos(); }).catch(function(e){ msg(e.message,true); }); }
  else if (t.id==="cReal"){ if(!confirm("Esto manda los correos aprobados A CADA RECEPTOR. ¿Continuar?")) return; msg("Enviando…"); api("/api/correos/enviar",{real:true}).then(function(j){ msg(j.enviados.length+" enviados a los receptores"+(j.fallos.length?", "+j.fallos.length+" fallos":"")+"."); cargarCorreos(); }).catch(function(e){ msg(e.message,true); }); }
});
(function arranque(){
  var t = new URLSearchParams(location.search).get("t");
  if(!t) return cargar();
  // enlace de acceso: se canjea una sola vez, queda la sesión en cookie y se limpia la URL
  fetch(PREFIJO+"/api/acceso/entrar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:t}),credentials:"same-origin"})
    .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error||"Enlace inválido."); return j; }); })
    .then(function(j){ if(j.usuario){ $("#quien").value=j.usuario.nombre||j.usuario.correo; try{ localStorage.setItem("iasima_quien", $("#quien").value); }catch(e){} }
      history.replaceState(null,"",location.pathname); cargar(); })
    .catch(function(e){ history.replaceState(null,"",location.pathname); cargar().then(function(){ var m=$("#pMsg")||$("#eMsg"); if(m){ m.textContent=e.message; m.style.color="var(--critico)"; } }); });
})();
$("#salir").addEventListener("click", function(){
  fetch(PREFIJO+"/api/acceso/salir",{method:"POST",credentials:"same-origin"}).then(function(){ location.reload(); });
});
setInterval(function(){ if (S.vista==="tablero" && S.estado && S.estado.enCurso) cargar(); }, 5000);
})();
</script>

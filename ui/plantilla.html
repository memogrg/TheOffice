<title>Oficina virtual IASIMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --chrome:#F4EFE2; --chrome2:#EAE3D1; --edge:#C9BFA4; --edge2:#B0A484;
  --ink:#2E2A22; --ink2:#5C5443; --ink3:#8A806A;
  --seal:#0B4A3F;
  --ok:#1B7F5E; --wait:#B07908; --hold:#A8362A; --idle:#7D8A85;
  --f:"Archivo","Helvetica Neue",Arial,sans-serif;
  --m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --chrome:#1C1E1B; --chrome2:#242723; --edge:#3A3E38; --edge2:#4C514A;
  --ink:#EDE7D8; --ink2:#BDB6A4; --ink3:#8B8574; --seal:#6FD3AE;
  --ok:#3FA87E; --wait:#C08F2E; --hold:#D96A50; --idle:#8CA1AC;}}
:root[data-theme="dark"]{
  --chrome:#1C1E1B; --chrome2:#242723; --edge:#3A3E38; --edge2:#4C514A;
  --ink:#EDE7D8; --ink2:#BDB6A4; --ink3:#8B8574; --seal:#6FD3AE;
  --ok:#3FA87E; --wait:#C08F2E; --hold:#D96A50; --idle:#8CA1AC;}
*{box-sizing:border-box}
body{margin:0; background:var(--chrome2); color:var(--ink);
  font-family:var(--f); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
.app{max-width:1400px; margin:0 auto; padding:16px 16px 40px}

.titlebar{background:var(--chrome); border:2px solid var(--edge); border-radius:4px;
  padding:9px 14px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:12px}
.dots{display:flex; gap:6px; flex:none}
.dots i{width:11px; height:11px; border-radius:50%; display:block}
.appname{font-family:var(--m); font-weight:700; font-size:13px}
.ver{font-family:var(--m); font-size:11.5px; color:var(--ink3)}
.tbspace{flex:1}
.tbchip{font-family:var(--m); font-size:11px; color:var(--ink2); display:inline-flex; align-items:center;
  gap:7px; background:var(--chrome2); border:1px solid var(--edge); border-radius:3px; padding:4px 9px; white-space:nowrap}
.tbchip i{width:7px; height:7px; border-radius:50%; background:var(--ok); flex:none}
.tbchip.amber i{background:var(--wait)} .tbchip.grey i{background:var(--idle)}

.main{display:grid; grid-template-columns:1fr 372px; gap:12px; align-items:start}
@media(max-width:1080px){.main{grid-template-columns:1fr}}

.stagewrap{background:var(--chrome); border:2px solid var(--edge); border-radius:4px; padding:10px}
.stage{position:relative; width:100%; aspect-ratio:12/7; background:#8FB0A4;
  border:3px solid #6E8C81; border-radius:2px; overflow:hidden}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block; shape-rendering:crispEdges}
#actores g.act{cursor:pointer}
#actores g.act:focus{outline:none}
#actores g.act:focus-visible rect.hit{stroke:#FFE27A; stroke-width:3; fill:rgba(255,226,122,.18)}
.ov{position:absolute; inset:0; pointer-events:none}
.nmtag{position:absolute; transform:translate(-50%,0); font-family:var(--m); font-size:10px;
  font-weight:700; color:#20302B; background:rgba(244,240,226,.93); border:1px solid rgba(32,48,43,.35);
  border-radius:2px; padding:1px 5px; white-space:nowrap}
.nmtag.on{background:#FFE27A; border-color:#8A6A12}
.bub{position:absolute; transform:translate(-50%,-100%); background:#F7F4E9; border:2px solid #2E3A35;
  border-radius:3px; padding:3px 7px; font-family:var(--m); font-size:10.5px; color:#22302B;
  white-space:nowrap; max-width:250px; overflow:hidden; text-overflow:ellipsis}
.bub::after{content:""; position:absolute; left:calc(50% - 3px); bottom:-6px; width:6px; height:6px;
  background:#F7F4E9; border-right:2px solid #2E3A35; border-bottom:2px solid #2E3A35}
.zone{position:absolute; transform:translate(-50%,-50%); font-family:var(--m); font-size:9px;
  font-weight:700; letter-spacing:.1em; color:rgba(30,45,40,.42)}
.stagefoot{display:flex; flex-wrap:wrap; gap:6px 16px; margin-top:9px; padding:0 2px;
  font-family:var(--m); font-size:11px; color:var(--ink2); align-items:center}
.stagefoot i{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;margin-right:5px}
.stagefoot button{font:inherit; font-family:var(--m); font-size:10.5px; padding:3px 9px; border-radius:3px;
  border:1px solid var(--edge2); background:var(--chrome2); color:var(--ink2); cursor:pointer}

.side{background:var(--chrome); border:2px solid var(--edge); border-radius:4px; overflow:hidden;
  display:flex; flex-direction:column; min-height:520px}
.tabs{display:flex; border-bottom:2px solid var(--edge); background:var(--chrome2)}
.tab{flex:1; font:inherit; font-family:var(--m); font-size:11.5px; font-weight:600; letter-spacing:.06em;
  text-transform:uppercase; padding:10px 8px; background:none; border:0; border-right:1px solid var(--edge);
  color:var(--ink3); cursor:pointer}
.tab:last-child{border-right:0}
.tab[aria-selected=true]{background:var(--chrome); color:var(--ink); box-shadow:inset 0 -3px 0 var(--seal)}
.sbody{overflow:auto; flex:1}
.ahead{padding:14px 15px; border-bottom:1px solid var(--edge); display:flex; gap:12px; align-items:center}
.ahead .pic{width:56px; height:56px; flex:none; background:var(--chrome2); border:2px solid var(--edge);
  border-radius:3px; display:flex; align-items:center; justify-content:center}
.ahead .pic svg{display:block; shape-rendering:crispEdges}
.ahead .id{flex:1; min-width:0}
.ahead h2{margin:0; font-family:var(--m); font-size:15px; font-weight:700}
.ahead .rl{font-size:12px; color:var(--ink3); margin-top:1px}
.boss{font-family:var(--m); font-size:9.5px; font-weight:700; background:#FFE27A; color:#5A4408;
  border:1px solid #A98718; border-radius:2px; padding:1px 5px; margin-left:6px; vertical-align:2px}
.live{font-family:var(--m); font-size:9px; font-weight:700; background:var(--ok); color:var(--chrome);
  border-radius:2px; padding:1px 5px; margin-left:5px; vertical-align:2px}
.pill{font-family:var(--m); font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  padding:3px 7px; border-radius:2px; border:1px solid; white-space:nowrap}
.pill.work{color:var(--ok); border-color:var(--ok)} .pill.hold{color:var(--hold); border-color:var(--hold)}
.pill.done,.pill.idle{color:var(--ink3); border-color:var(--edge2)}
.blk{padding:13px 15px; border-bottom:1px solid var(--edge)}
.blk:last-child{border-bottom:none}
.k{font-family:var(--m); font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); margin-bottom:7px}
.doing{font-size:13.5px; margin:0}
.rrow{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:5px 0;
  border-bottom:1px dashed var(--edge)}
.rrow:last-child{border-bottom:none}
.rrow .l{font-size:12.5px; color:var(--ink2)}
.rrow .v{font-family:var(--m); font-size:14px; font-weight:700; font-variant-numeric:tabular-nums}
.lg{display:grid; grid-template-columns:48px 1fr; gap:10px; padding:5px 0; font-size:12px;
  color:var(--ink2); border-bottom:1px dashed var(--edge)}
.lg:last-child{border-bottom:none}
.lg time{font-family:var(--m); font-size:10.5px; color:var(--ink3)}
.al{border-left:4px solid var(--idle); background:var(--chrome2); padding:9px 11px; margin-bottom:7px; border-radius:0 3px 3px 0}
.al.critico{border-left-color:var(--hold)} .al.alto{border-left-color:var(--wait)} .al.ok{border-left-color:var(--ok)}
.al .t{font-weight:600; font-size:13px}
.al .d{font-size:11.5px; color:var(--ink3); margin-top:4px; font-family:var(--m); line-height:1.6}
.chat{display:flex; flex-direction:column; gap:8px; padding:13px 15px; max-height:260px; overflow:auto}
.msg{max-width:88%; padding:8px 11px; border-radius:4px; font-size:13px; line-height:1.45}
.msg.me{align-self:flex-end; background:var(--seal); color:var(--chrome)}
.msg.ceo{align-self:flex-start; background:var(--chrome2); border:1px solid var(--edge)}
.msg .w{display:block; font-family:var(--m); font-size:9.5px; text-transform:uppercase; opacity:.7; margin-bottom:3px}
form.row{display:flex; gap:7px; padding:12px 15px; border-top:1px solid var(--edge)}
input[type=text],input[type=email],select{flex:1; min-width:0; font:inherit; font-size:13px; padding:8px 10px;
  border:1px solid var(--edge2); border-radius:3px; background:var(--chrome2); color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--seal); outline-offset:-1px}
button.b{font:inherit; font-size:12.5px; font-weight:600; padding:8px 13px; border-radius:3px;
  border:1px solid var(--seal); background:var(--seal); color:var(--chrome); cursor:pointer; white-space:nowrap}
button.b.gh{background:none; color:var(--ink2); border-color:var(--edge2)}
button.b.dg{background:none; color:var(--hold); border-color:var(--hold)}
.hint{font-size:11.5px; color:var(--ink3); margin:8px 0 0; line-height:1.45}

.roster{margin-top:12px; background:var(--chrome); border:2px solid var(--edge); border-radius:4px; padding:10px}
.rhead{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:9px; padding:0 2px}
.rhead .t{font-family:var(--m); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3)}
.cards{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px}
.card{flex:0 0 222px; background:var(--chrome2); border:2px solid var(--edge); border-radius:3px;
  padding:9px 10px; cursor:pointer; text-align:left; font:inherit; color:inherit; display:flex; gap:9px}
.card.on{border-color:var(--seal)}
.card .pic{width:36px; height:36px; flex:none; background:var(--chrome); border:1px solid var(--edge);
  border-radius:2px; display:flex; align-items:center; justify-content:center}
.card .cb{flex:1; min-width:0; display:block}
.card .l1{display:flex; align-items:center; justify-content:space-between; gap:6px}
.card .cn{font-family:var(--m); font-size:11.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .cp{font-family:var(--m); font-size:9px; font-weight:600; text-transform:uppercase; padding:2px 5px;
  border-radius:2px; border:1px solid; white-space:nowrap; flex:none}
.card .cs{display:block; font-family:var(--m); font-size:9.5px; color:var(--ink3); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bar{display:block; height:5px; background:var(--chrome); border:1px solid var(--edge); border-radius:2px; margin-top:6px; overflow:hidden}
.bar i{display:block; height:100%}
.addcard{flex:0 0 150px; background:none; border:2px dashed var(--edge2); border-radius:3px; color:var(--ink2);
  font:inherit; font-size:12.5px; font-weight:600; cursor:pointer}
.hireform[hidden]{display:none}
.hireform{margin-top:10px; padding:12px; background:var(--chrome2); border:1px solid var(--edge); border-radius:3px;
  display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end}
@media(max-width:700px){.hireform{grid-template-columns:1fr}}
.hireform label{font-family:var(--m); font-size:10px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--ink3); display:block; margin-bottom:4px}
footer{margin-top:14px; font-size:11.5px; color:var(--ink3); line-height:1.6; padding:0 4px}
footer b{color:var(--ink2)} footer code{font-family:var(--m); font-size:10.5px}
</style>

<div class="app">
  <div class="titlebar">
    <span class="dots"><i style="background:#E0685C"></i><i style="background:#E8B33C"></i><i style="background:#5FBF63"></i></span>
    <span class="appname">Oficina IASIMA</span>
    <span class="ver" id="ver">v0.3</span>
    <span class="tbspace"></span>
    <span class="tbchip" id="chipDatos"><i></i>—</span>
    <span class="tbchip amber"><i></i>base de pruebas</span>
  </div>

  <div class="main">
    <div class="stagewrap">
      <div class="stage" id="stage">
        <svg id="scene" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice">
          <g id="fondo"></g><g id="actores"></g>
        </svg>
        <div class="ov" id="ov"></div>
      </div>
      <div class="stagefoot">
        <span><i style="background:var(--ok)"></i>Trabajando</span>
        <span><i style="background:var(--hold)"></i>Espera aprobación</span>
        <span><i style="background:var(--idle)"></i>Libre</span>
        <span class="tbspace" style="flex:1"></span>
        <button id="pausa" type="button">Pausar movimiento</button>
      </div>
    </div>

    <div class="side">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tab-a" aria-selected="true">Agente</button>
        <button class="tab" role="tab" id="tab-r" aria-selected="false">Reportes</button>
      </div>
      <div class="sbody" id="sbody" role="tabpanel"></div>
    </div>
  </div>

  <div class="roster">
    <div class="rhead"><span class="t">Planilla · <span id="hc">8</span> agentes</span><span class="t" id="payroll"></span></div>
    <div class="cards" id="cards"></div>
    <div class="hireform" id="hf" hidden>
      <div><label for="hn">Nombre del agente</label><input type="text" id="hn" placeholder="Ej.: Cobranza" style="width:100%"></div>
      <div><label for="hr">Puesto</label><select id="hr" style="width:100%"></select></div>
      <div style="display:flex;gap:7px"><button class="b" id="hok" type="button">Contratar</button><button class="b gh" id="hno" type="button">Cancelar</button></div>
    </div>
  </div>

  <footer id="pie"></footer>
</div>

function ruta(ac, destino){
  if(destino==="bano") return [LUGARES.puertaBano,{x:LUGARES.bano.x,y:LUGARES.bano.y}];
  if(destino==="casa" && ac.x>1010 && ac.y>470) return [LUGARES.puertaBano, ac.casa];

function nuevaActividad(ac){
  var r=Math.random();
  if(r<.30){ ac.estado="sentado"; ac.t=8+Math.random()*14;
             if(Math.random()<.5) decir(ac, elegir(FRASES_TRABAJO), 4); return; }
  if(r<.48){ ac.ruta=ruta(ac,"cafe"); ac.estado="yendo"; ac.tras="cafe"; return; }
  if(r<.62){ ac.ruta=ruta(ac,"bano"); ac.estado="yendo"; ac.tras="bano"; return; }
  if(r<.72){ ac.ruta=ruta(ac,"agua"); ac.estado="yendo"; ac.tras="agua"; return; }
  if(r<.80){ ac.ruta=ruta(ac,"reunion"); ac.estado="yendo"; ac.tras="reunion"; return; }
  // charla con un compañero sentado
  var libres=actores.filter(function(o){ return o!==ac && o.estado==="sentado" && !o.pareja; });
  if(libres.length){
    var otro=elegir(libres), d=elegir(CHARLAS);
    ac.pareja=otro; otro.pareja=ac;
    ac.ruta=[{x:(otro.casa.x+ac.casa.x)/2, y:Math.max(ac.casa.y,otro.casa.y)+34}];
    otro.ruta=[{x:ac.ruta[0].x+38, y:ac.ruta[0].y}];
    ac.estado="yendo"; ac.tras="charla"; ac.linea=d[0];
    otro.estado="yendo"; otro.tras="charla"; otro.linea=d[1];
    return;
  }
  ac.estado="sentado"; ac.t=6+Math.random()*8;
}
function decir(ac, texto, seg){ ac.frase=texto; ac.fraseT=seg||4; }

var ultimo=performance.now();
function latido(ahora){
  var dt=Math.min(.06,(ahora-ultimo)/1000); ultimo=ahora;
  if(movimiento){
    actores.forEach(function(ac){
      if(ac.fraseT>0){ ac.fraseT-=dt; if(ac.fraseT<=0) ac.frase=""; }
      if(ac.estado==="yendo"){
        var d=ac.ruta[0];
        if(!d){ ac.estado="sentado"; ac.t=5; return; }
        var dx=d.x-ac.x, dy=d.y-ac.y, dist=Math.hypot(dx,dy), v=62*dt;
        if(dist<=v){ ac.x=d.x; ac.y=d.y; ac.ruta.shift();
          if(!ac.ruta.length){
            if(ac.tras==="charla"){ ac.estado="charlando"; ac.t=5+Math.random()*4; decir(ac,ac.linea,ac.t); }
            else if(ac.tras==="casa"){ ac.estado="sentado"; ac.t=8+Math.random()*12; }
            else { ac.estado="haciendo"; ac.t=3+Math.random()*5;
                   if(ac.tras==="cafe") decir(ac, elegir(FRASES_CAFE), 4); }
          }
        } else { ac.x+=dx/dist*v; ac.y+=dy/dist*v; }
        ac.paso+=dt; ac.pose = (Math.floor(ac.paso*6)%2) ? "paso1" : "paso2";
      } else {
        ac.pose="quieto";
        ac.t-=dt;
        if(ac.t<=0){
          if(ac.estado==="sentado"){ nuevaActividad(ac); }
          else if(ac.estado==="charlando"){ ac.pareja=null; ac.ruta=ruta(ac,"casa"); ac.estado="yendo"; ac.tras="casa"; }
          else { ac.ruta=ruta(ac,"casa"); ac.estado="yendo"; ac.tras="casa"; }
        }
      }
    });
  }
  dibujarActores();
  requestAnimationFrame(latido);
}

function nrm(x){ return String(x==null?"":x).normalize("NFKD").replace(/[\u0300-\u036f]/g,"")
  .toUpperCase().replace(/[^A-Z0-9]+/g," ").trim(); }
function puntuar(txt, pal){ var t=nrm(txt), p=0, peg=[];
  for(var k in (pal||{})) if(t.indexOf(nrm(k))>=0){ p+=pal[k]; peg.push(k); }
  return {p:p, peg:peg}; }
function hallarCia(txt){ var t=nrm(txt), mejor=null;
  (D&&D.companias||[]).forEach(function(c){ var n=nrm(c.name);
    if(n.length<4) return;
    if(t.indexOf(n)>=0 && (!mejor || n.length>nrm(mejor.name).length)) mejor=c; });
  return mejor; }
function quien(a){ return (a.rol && a.rol!==a.nombre) ? a.nombre+" ("+a.rol.toLowerCase()+")" : a.nombre; }
function decidir(v){
  var R = D && D.roster;
  if(!R) return {mensaje:"Todavía no tengo el contrato de los agentes. Corra un agente para generarlo."};
  var m = R.agentes.map(function(a){ var q=puntuar(v,a.palabras); return {a:a,p:q.p}; })
           .sort(function(x,y){return y.p-x.p;});
  var pend = (R.noConstruidos||[]).map(function(a){ var q=puntuar(v,a.palabras); return {a:a,p:q.p}; })
           .sort(function(x,y){return y.p-x.p;});
  var g=m[0], s2=m[1];
  if(pend[0] && pend[0].p>=3 && (!g || pend[0].p>g.p))
    return {mensaje:"Eso sería trabajo de "+quien(pend[0].a)+", que todavía no está construido. "+pend[0].a.hace};
  if(!g || g.p<3)
    return {mensaje:"No sé a quién pasarle eso. Hoy puedo pedirle a: "+
      R.agentes.map(function(a){return quien(a)+" — "+a.hace.slice(0,52)+"…";}).join(" · ")};
  if(s2 && s2.p>0 && g.p < s2.p*1.5)
    return {mensaje:"Puede ser para "+quien(g.a)+" o para "+quien(s2.a)+". ¿Cuál de los dos?"};
  var falta=null, cia=null;
  (g.a.parametros||[]).forEach(function(par){
    if(par.nombre==="empresa"){ cia=hallarCia(v); if(!cia) falta=par; }});
  if(falta) return {mensaje:quien(g.a)+" puede hacerlo, pero "+falta.pregunta};
  return {mensaje:"Se lo paso a "+quien(g.a)+(cia?" para "+cia.name:"")+"."+
    (g.a.escribe?" Escribe en Odoo, así que primero le va a proponer los cambios.":"")+
    (g.a.vivo===false?" Ese todavía no corre de verdad.":"")};
}

/* ================= pintar ================= */
function pintar(){
  document.getElementById("tab-a").setAttribute("aria-selected", tab==="a"?"true":"false");
  document.getElementById("tab-r").setAttribute("aria-selected", tab==="r"?"true":"false");
  document.getElementById("sbody").innerHTML = tab==="a" ? panelAgente() : panelReportes();
  planilla(); cablear();
}
function cablear(){
  var cf=document.getElementById("cf");
  if(cf) cf.addEventListener("submit",function(e){ e.preventDefault();
    var i=document.getElementById("ci"), v=i.value.trim(); if(!v) return;
    if(!CHAT.length) CHAT.push({w:"ceo",t:"Buenos días. ¿Qué necesita?"});
    CHAT.push({w:"me",t:v});
    var r = decidir(v);
    CHAT.push({w:"ceo", t:r.mensaje});
    pintar(); var ch=document.getElementById("chat"); if(ch) ch.scrollTop=ch.scrollHeight;
    var ni=document.getElementById("ci"); if(ni) ni.focus();
  });
  var fx=document.getElementById("fx"); if(fx) fx.addEventListener("click",function(){ porId(sel).fire=true; pintar(); });
  var fn=document.getElementById("fn"); if(fn) fn.addEventListener("click",function(){ porId(sel).fire=false; pintar(); });
  var fy=document.getElementById("fy"); if(fy) fy.addEventListener("click",function(){
    AG=AG.filter(function(a){return a.id!==sel;}); sel=AG.length?AG[0].id:""; guardar(); sembrar(); pintar(); });
}
